---
- name: Automatizacion de servidores Ubuntu con Ansible
  hosts: servidores
  become: yes
  tasks:
    - name: 1. Actualizar cache de APT del sistema operativo
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 2. Crear el usuario 'itla' en cada servidor
      user:
        name: itla
        state: present
        shell: /bin/bash
        create_home: yes

    - name: 3. Crear una carpeta llamada 'app'
      file:
        path: /app
        state: directory
        owner: itla
        group: itla
        mode: '0755'

    - name: 4. Crear un archivo hola.txt en la carpeta app
      copy:
        content: "Hola mundo desde Ansible en el servidor Ubuntu\n"
        dest: /app/hola.txt
        owner: itla
        group: itla
        mode: '0644'

    - name: 5. Instalar la aplicacion 'cowsay' y 'htop'
      apt:
        name:
          - cowsay
          - htop
        state: present